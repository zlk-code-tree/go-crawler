# https://goframe.org/docs/web/server-config-file-template
server:
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  path: "./logs"
  file: "{Y-m-d}.log"
  level: "all"
  stdout: true  # 可选：是否同时输出到控制台

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    type: "mysql"
    link: "admin:admin@tcp(127.0.0.1:3306)/easyadmin8?charset=utf8mb4&parseTime=True&loc=Local"
    debug: true
    # 连接池配置
    maxIdle: 10          # 最大空闲连接数
    maxOpen: 100         # 最大打开连接数
    maxLifetime: 300     # 连接最大生命周期（秒）
    charset: "utf8mb4"

# 爬虫并发与视频直链解析（配置变更需重启服务）
crawler:
  productDetail:
    enabled: false
    concurrency: 1
    timeoutSeconds: 60
    maxViews: 9
  video:
    maxDetailViews: 10
    maxEmptyStreak: 4
    autoDownload: true
    resolver:
      workers: 2
      queueCapacity: 1000
      timeoutSeconds: 120
      httpTimeoutSeconds: 15
      retryAttempts: 3
      retryDelaySeconds: 1
      refillIntervalSeconds: 5
      shutdownTimeoutSeconds: 30
