# =====================================================
# 抖音电商罗盘爬虫系统 - 配置文件
# =====================================================

server:
  address: ":8081"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  serverMaxBodyLen: 104857600  # 100MB，最大请求体大小

# JWT 配置
jwt:
  secret: "go-crawler-jwt-secret-2024-change-in-production"
  expire: 86400  # 24小时

database:
  default:
    type: "mysql"
    link: "ly_admin:4qPbP%dd#aQs8wR@tcp(rm-2zeyw894ggx6yj3i2yo.mysql.rds.aliyuncs.com:3306)/ly_crawler?charset=utf8mb4&parseTime=True&loc=Local"
    debug: true
    maxIdle: 10
    maxOpen: 100
    maxLifetime: "30s"

logger:
  path: "./logs/server"
  file: "{Y-m-d}.log"
  level: "all"
  stdout: true
  rotateSize: "100M"
  rotateBackupLimit: 7
  rotateBackupExpire: "30d"
  rotateCheckInterval: "1h"

crawler:
  # 浏览器配置
  browser:
    headless: false
    timeout: 300
    slowMotion: 100
    userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  
  # 爬取配置
  scrape:
    totalPages: 20
    itemsPerPage: 10
    retryTimes: 3
    retryDelay: 2000
  
  # Cookie 管理
  cookie:
    enabled: true
    expireCheck: true
  
  # 断点续爬
  checkpoint:
    enabled: true
    autoSave: true
    saveInterval: 1

# 数据导出配置
export:
  csv:
    enabled: true
    encoding: "utf-8-bom"
  excel:
    enabled: true
    autoFilter: true

# 权限配置
permission:
  # 权限白名单，白名单中的用户跳过权限验证
  whitelist:
    - admin  # 超级用户
    - zhanglikun  # 其他需要跳过权限验证的用户

# 第三方平台对接配置
platform:
  douyin:
    appKey: "7643346354286151194"           # 抖店开放平台 AppKey
    appSecret: "169c1d3d-df15-4bc9-b5ac-e772441cca5e"  # 抖店开放平台 AppSecret
    baseUrl: "https://openapi-fxg.jinritemai.com"  # 抖店API地址
    timeout: 15000                   # 请求超时(ms)
  kuaishou:
    appKey: ""
    appSecret: ""
    baseUrl: ""
  shipinhao:
    appKey: ""
    appSecret: ""
    baseUrl: ""
  qianchuan:
    appId: 1867057521692762                     # 巨量千川应用ID（在巨量千川开放平台创建应用后获取）
    appSecret: "2de7efc76d5527514c6b3d37b7ce9c9d698a79c8"                 # 巨量千川应用密钥
    pullDays: 30                  # 拉取最近多少天的报表数据
    redirectUri: "https://admin.liyuntushu.com/api/douyin/callback"  # OAuth授权回调地址

# 飞书配置
feishu:
  appId: "cli_a96309db59fadbef"  # 飞书开放平台应用ID
  appSecret: "H9UZDDSudwbXrKHko4AMVlJOBYIUTrXu"  # 飞书开放平台应用密钥
  redirectUri: "http://localhost:8081/api/FeishuAuthController/FeishuCallback"  # 飞书授权回调地址

# 任务调度监控配置
task:
  feishuWebhook: ""  # 飞书机器人webhook地址，用于任务失败告警通知
  concurrency: 5     # 全局并发数，控制同时调用第三方API的工作线程数